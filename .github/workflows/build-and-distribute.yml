name: Build and Distribute

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk-path: ${{ steps.build.outputs.apk-path }}
      build-number: ${{ github.run_number }}
      release-ready: ${{ steps.release_signing_check.outputs.ready }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run code analysis
        run: |
          flutter analyze --android-skip-build-dependency-validation
          dart pub global activate custom_lint
          dart pub global run custom_lint || true

      - name: Run tests
        run: flutter test --coverage

      - name: Build debug APK
        id: build
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation
          echo "apk-path=build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Check release signing prerequisites
        id: release_signing_check
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "android/app/release-keystore.jks" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing prerequisites missing. Skipping signed release APK build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.release_signing_check.outputs.ready == 'true'
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Skip release APK build without signing data
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.release_signing_check.outputs.ready != 'true'
        run: echo "Skipping signed release APK build because release keystore or signing secrets are unavailable."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  firebase-distribute:
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && needs.build.outputs.release-ready == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT != ''
    
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk

      - name: Validate Firebase service account
        id: firebase_auth_check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import json
          import os
          service_account = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "").strip()
          ready = False
          if service_account:
              try:
                  payload = json.loads(service_account)
                  ready = bool(payload.get("client_email") and payload.get("private_key"))
              except json.JSONDecodeError:
                  ready = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Distribute to Firebase App Distribution
        if: steps.firebase_auth_check.outputs.ready == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:246255479274:android:177b790682bb5b59862a93
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Build #${{ github.run_number }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Modernized build toolchain (AGP 9.2.1)
          testers: ${{ secrets.FIREBASE_TESTERS }}

      - name: Skip Firebase distribution with invalid service account secret
        if: steps.firebase_auth_check.outputs.ready != 'true'
        run: echo "::warning::Skipping Firebase App Distribution because FIREBASE_SERVICE_ACCOUNT is missing or malformed."

  notify:
    needs: [build, firebase-distribute]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Build Status
        run: |
          echo "Build #${{ github.run_number }} completed"
          echo "Status: ${{ job.status }}"
