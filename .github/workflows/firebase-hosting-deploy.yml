name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  FLUTTER_VERSION: '3.44.0'
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=FLUTTER_WEB_USE_SKIA=true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage/lcov.info

  deploy-hosting:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=FLUTTER_WEB_USE_SKIA=true

      - name: Validate Firebase service account secret
        id: firebase-sa-check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is missing. Skipping Firebase Hosting deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! python3 -c "import json,os,sys; data=json.loads(os.environ.get('FIREBASE_SERVICE_ACCOUNT','')); required=['type','project_id','private_key','client_email']; missing=[k for k in required if not data.get(k)]; ok=(data.get('type')=='service_account' and not missing); sys.exit(0 if ok else 1)"; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is invalid. It must be a service_account key JSON with project_id, private_key, and client_email. Skipping Firebase Hosting deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase Hosting
        if: steps.firebase-sa-check.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: 'starpage-ed409'
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Skip Firebase Hosting deployment without credentials
        if: steps.firebase-sa-check.outputs.ready != 'true'
        run: echo "Skipping Firebase Hosting deployment because FIREBASE_SERVICE_ACCOUNT is missing or invalid."
