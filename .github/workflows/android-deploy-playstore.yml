name: Android Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-deploy-playstore.yml'
      - 'pubspec.yaml'
      - 'android/app/build.gradle.kts'

env:
  FLUTTER_VERSION: '3.44.0'

permissions:
  contents: write

jobs:
  deploy-play-store:
    name: Deploy to Google Play (${{ github.event.inputs.track || 'auto' }})
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check release signing prerequisites
        id: release_signing_check
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "android/starpage-keystore-new.jks" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release signing prerequisites missing (keystore or passwords). Play Store deployment will be skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deployment when signing is unavailable
        if: steps.release_signing_check.outputs.ready != 'true'
        run: |
          echo "Skipping Play Store deployment because release signing is not configured."

      - name: Build App Bundle
        if: steps.release_signing_check.outputs.ready == 'true'
        run: flutter build appbundle --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify bundle exists
        if: steps.release_signing_check.outputs.ready == 'true'
        run: |
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "App bundle was not generated at the expected path"
          fi
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: steps.release_signing_check.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.starpage.app
          releaseFiles: 'build/app/outputs/bundle/release/app-release.aab'
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: 'whats-new'
          mappingFile: 'build/app/outputs/mapping/release/mapping.txt'

      - name: Create Release Notes
        if: success()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get version from pubspec.yaml
            const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
            const versionMatch = pubspec.match(/version:\s+(.+)/);
            const version = versionMatch ? versionMatch[1] : 'unknown';
            
            // Create release
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `android-v${version}`,
              name: `Android Release ${version}`,
              body: `ðŸš€ **Android App Deployed**\n\nðŸ“± Version: ${version}\nðŸª Track: ${{ github.event.inputs.track || 'internal' }}\nðŸ‘¤ By: ${{ github.actor }}\nâ° Time: ${new Date().toISOString()}`,
              draft: false,
              prerelease: ${{ github.event.inputs.track != 'production' }}
            })

      - name: Post Deployment Status
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? 'âœ…' : 'âŒ';
            const track = '${{ github.event.inputs.track || 'internal' }}';
            console.log(`${status} Android Deployment to ${track} track: ${{ job.status }}`);

