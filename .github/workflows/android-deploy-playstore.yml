# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Android Deploy to Play Store
# Verification trigger: no functional workflow change.
# CI verification trigger: 2026-08-13

on:
  workflow_dispatch:
    inputs:
      tracks:
        description: 'Release tracks'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-deploy-playstore.yml'
      - 'pubspec.yaml'
      - 'android/app/build.gradle'
      - 'android/gradle/**'

env:
  FLUTTER_VERSION: '3.44.0'

permissions:
  contents: write

jobs:
  deploy-play-store:
    name: Deploy to Google Play (${{ github.event.inputs.tracks || 'auto' }})
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate unique Play Store version code
        id: play_version
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( VERSION_CODE > 2100000000 )); then
            echo "::error::Generated Android version code exceeds the supported limit."
            exit 1
          fi
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Using Play Store version code $VERSION_CODE for workflow run $GITHUB_RUN_NUMBER, attempt $GITHUB_RUN_ATTEMPT."

      - name: Prepare Android signing
        id: release_signing_check
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'starpage' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_FILE: ${{ github.workspace }}/android/app/upload-keystore.jks
        run: |
          set -e

          mkdir -p android

          CANDIDATE_STORE_FILES=(
            "$ANDROID_STORE_FILE"
            "${GITHUB_WORKSPACE}/android/upload-keystore.jks"
            "${GITHUB_WORKSPACE}/android/app/upload-keystore.jks"
            "${GITHUB_WORKSPACE}/android/starpage-keystore.jks"
            "${GITHUB_WORKSPACE}/android/starpage-keystore-new.jks"
            "${GITHUB_WORKSPACE}/android/app/release-keystore.jks"
          )

          STORE_FILE_PATH=""
          for candidate in "${CANDIDATE_STORE_FILES[@]}"; do
            if [ -n "$candidate" ] && [ -f "$candidate" ]; then
              STORE_FILE_PATH="$candidate"
              break
            fi
          done

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -z "$STORE_FILE_PATH" ]; then
            STORE_FILE_PATH="$ANDROID_STORE_FILE"
            if ! echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE_PATH" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is invalid or does not decode to a usable keystore."
              rm -f "$STORE_FILE_PATH"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ ! -f "$STORE_FILE_PATH" ]; then
            echo "::notice::Android release signing prerequisites are missing. Play Store deployment will be skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! keytool -list -v -keystore "$STORE_FILE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/tmp/keystore_check.txt 2>&1; then
            echo "::error::The keystore file or signing secrets do not match the configured release key."
            cat /tmp/keystore_check.txt || true
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Resolved signing keystore: $STORE_FILE_PATH"
          keytool -list -v -keystore "$STORE_FILE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E 'Alias name:|SHA1:' || true

          printf '%s\n%s\n%s\n%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=$STORE_FILE_PATH" > android/key.properties

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Using repository keystore signing for Play Store upload."

      - name: Skip deployment when signing is unavailable
        if: steps.release_signing_check.outputs.ready != 'true'
        run: |
          echo "Skipping Play Store deploy because release signing is not configured."

      - name: Validate Gradle wrapper
        if: steps.release_signing_check.outputs.ready == 'true'
        run: |
          set -e
          cd android
          ls -l ./gradlew
          ls -l ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          test -f ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          bash ./gradlew --version

      - name: Build App Bundle
        if: steps.release_signing_check.outputs.ready == 'true'
        run: |
          cd android
          bash ./gradlew app:bundleRelease --console=plain --stacktrace --info -PplayStoreVersionCode=${{ steps.play_version.outputs.code }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'starpage' }}
          ANDROID_STORE_FILE: ${{ github.workspace }}/android/starpage-keystore-new.jks

      - name: Verify bundle exists
        if: steps.release_signing_check.outputs.ready == 'true'
        run: |
          BUNDLE_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "App bundle was not generated at the expected path: $BUNDLE_PATH"
            exit 1
          fi
          ls -lh "$BUNDLE_PATH"

      - name: Upload AAB artifact
        if: steps.release_signing_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping artifact
        if: steps.release_signing_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: android-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload to Google Play
        if: steps.release_signing_check.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.starpage.app
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          tracks: ${{ github.event.inputs.tracks || 'internal' }}
          status: completed
          whatsNewDirectory: 'whats-new'
          mappingFile: 'android/app/build/outputs/mapping/release/mapping.txt'

      - name: Create or Update Release Notes
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
            const versionMatch = pubspec.match(/version:\s+(.+)/);
            const version = versionMatch ? versionMatch[1].replace(/\+\d+$/, '') : 'unknown';
            const versionCode = '${{ steps.play_version.outputs.code }}';
            const buildTagName = `android-v${version}+${versionCode}-build${context.runNumber}`;
            const legacyTagName = `android-v${version}+${versionCode}`;
            const releaseBody = `🚀 **Android App Deployed**\n\n📱 Version: ${version}+${versionCode}\n🏪 Track: ${{ github.event.inputs.tracks || 'internal' }}\n👤 By: ${{ github.actor }}\n⏰ Time: ${new Date().toISOString()}`;
            const prerelease = ${{ (github.event.inputs.tracks || 'internal') != 'production' }};

            let existing = null;
            let chosenTag = buildTagName;

            for (const tag of [buildTagName, legacyTagName]) {
              try {
                existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });
                chosenTag = tag;
                break;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            if (existing) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                tag_name: chosenTag,
                name: `Android Release ${version}+${versionCode} (Run ${context.runNumber})`,
                body: releaseBody,
                draft: false,
                prerelease,
              });
              console.log(`Updated existing GitHub release for ${chosenTag}`);
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: buildTagName,
                name: `Android Release ${version}+${versionCode} (Run ${context.runNumber})`,
                body: releaseBody,
                draft: false,
                prerelease,
              });
              console.log(`Created new GitHub release for ${buildTagName}`);
            }

      - name: Post Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const releaseTrack = '${{ github.event.inputs.tracks || 'internal' }}';
            console.log(`${status} Android Deployment to ${releaseTrack} track: ${{ job.status }}`);
