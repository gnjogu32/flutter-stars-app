# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Android Deploy to Play Store
# Verification trigger: no functional workflow change.
# CI verification trigger: 2026-08-13

on:
  workflow_dispatch:
    inputs:
      tracks:
        description: 'Release tracks'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-deploy-playstore.yml'
      - 'pubspec.yaml'
      - 'android/app/build.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/**'

env:
  FLUTTER_VERSION: '3.44.0'
  EXPECTED_UPLOAD_CERT_SHA256: '67:5D:98:42:C1:71:AE:63:AA:0B:34:56:E0:3B:94:68:4E:86:60:0C:A0:D5:DE:B7:21:43:21:C9:15:3F:F6:BC'

permissions:
  contents: write

jobs:
  deploy-play-store:
    name: Deploy to Google Play (${{ github.event.inputs.tracks || 'auto' }})
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate unique Play Store version code
        id: play_version
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( VERSION_CODE > 2100000000 )); then
            echo "::error::Generated Android version code exceeds the supported limit."
            exit 1
          fi
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Using Play Store version code $VERSION_CODE for workflow run $GITHUB_RUN_NUMBER, attempt $GITHUB_RUN_ATTEMPT."

      - name: Prepare Android signing
        id: release_signing_check
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'starpage' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_FILE: ${{ github.workspace }}/android/app/upload-keystore.jks
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Required Android signing secrets are missing."
            exit 1
          fi

          mkdir -p "$(dirname "$ANDROID_STORE_FILE")"
          STORE_FILE_PATH="$ANDROID_STORE_FILE"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE_PATH" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is invalid or could not be decoded."
            rm -f "$STORE_FILE_PATH"
            exit 1
          fi

          if ! keytool -list -v -keystore "$STORE_FILE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /tmp/keystore_check.txt 2>&1; then
            echo "::error::The keystore, password, or alias is invalid."
            exit 1
          fi

          keytool -exportcert -keystore "$STORE_FILE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -file /tmp/upload-key-certificate.der >/dev/null 2>&1
          ACTUAL_UPLOAD_CERT_SHA256="$(sha256sum /tmp/upload-key-certificate.der | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_UPLOAD_CERT_SHA256="$(printf '%s' "$EXPECTED_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL_UPLOAD_CERT_SHA256" ] || [ "$ACTUAL_UPLOAD_CERT_SHA256" != "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            echo "::error::The configured keystore certificate does not match the Play Console upload key."
            exit 1
          fi

          echo "Verified replacement upload-key certificate fingerprint."

          printf '%s\n%s\n%s\n%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=$STORE_FILE_PATH" > android/key.properties

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "store_file_path=$STORE_FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "Using repository keystore signing for Play Store upload."

      - name: Validate Gradle wrapper
        if: steps.release_signing_check.outputs.ready == 'true'
        run: |
          set -e
          cd android
          ls -l ./gradlew
          ls -l ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties
          test -f ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          bash ./gradlew --version

      - name: Build App Bundle
        if: steps.release_signing_check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew app:bundleRelease --console=plain --stacktrace --info -PplayStoreVersionCode=${{ steps.play_version.outputs.code }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'starpage' }}
          ANDROID_STORE_FILE: ${{ steps.release_signing_check.outputs.store_file_path }}

      - name: Verify signed bundle
        if: steps.release_signing_check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          BUNDLE_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "App bundle was not generated at the expected path: $BUNDLE_PATH"
            exit 1
          fi
          jarsigner -verify "$BUNDLE_PATH" > /tmp/aab-signature-check.txt 2>&1 || true
          if ! grep -qi 'jar verified' /tmp/aab-signature-check.txt; then
            echo "::error::The generated app bundle is not signed with a verifiable JAR signature."
            exit 1
          fi

          keytool -printcert -jarfile "$BUNDLE_PATH" > /tmp/aab-signers.txt
          AAB_UPLOAD_CERT_SHA256="$(python3 -c 'import re,sys; text=open(sys.argv[1]).read(); match=re.search(r"SHA256:\s*((?:[0-9A-Fa-f]{2}:?[\s\r\n]*){32})", text); print(re.sub(r"[^0-9A-Fa-f]", "", match.group(1)).upper() if match else "")' /tmp/aab-signers.txt)"
          ACTUAL_UPLOAD_CERT_SHA256="$(sha256sum /tmp/upload-key-certificate.der | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')"
          if [ -z "$AAB_UPLOAD_CERT_SHA256" ] || [ "$AAB_UPLOAD_CERT_SHA256" != "$ACTUAL_UPLOAD_CERT_SHA256" ]; then
            echo "::error::The app bundle signer does not match the approved Play upload key."
            exit 1
          fi

          echo "Verified signed app bundle with the approved upload key."
          ls -lh "$BUNDLE_PATH"

      - name: Upload AAB artifact
        if: steps.release_signing_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping artifact
        if: steps.release_signing_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload to Google Play
        if: steps.release_signing_check.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.starpage.app
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          tracks: ${{ github.event.inputs.tracks || 'production' }}
          status: completed
          whatsNewDirectory: 'whats-new'
          mappingFile: 'android/app/build/outputs/mapping/release/mapping.txt'

      - name: Create or Update Release Notes
        if: success() && steps.release_signing_check.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
            const versionMatch = pubspec.match(/version:\s+(.+)/);
            const version = versionMatch ? versionMatch[1].replace(/\+\d+$/, '') : 'unknown';
            const versionCode = '${{ steps.play_version.outputs.code }}';
            const buildTagName = `android-v${version}+${versionCode}-build${context.runNumber}`;
            const legacyTagName = `android-v${version}+${versionCode}`;
            const releaseTrack = '${{ github.event.inputs.tracks || 'production' }}';
            const releaseBody = `🚀 **Android App Deployed**\n\n📱 Version: ${version}+${versionCode}\n🏪 Track: ${releaseTrack}\n👤 By: ${{ github.actor }}\n⏰ Time: ${new Date().toISOString()}`;
            const prerelease = releaseTrack !== 'production';

            let existing = null;
            let chosenTag = buildTagName;

            for (const tag of [buildTagName, legacyTagName]) {
              try {
                existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });
                chosenTag = tag;
                break;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            if (existing) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                tag_name: chosenTag,
                name: `Android Release ${version}+${versionCode} (Run ${context.runNumber})`,
                body: releaseBody,
                draft: false,
                prerelease,
              });
              console.log(`Updated existing GitHub release for ${chosenTag}`);
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: buildTagName,
                name: `Android Release ${version}+${versionCode} (Run ${context.runNumber})`,
                body: releaseBody,
                draft: false,
                prerelease,
              });
              console.log(`Created new GitHub release for ${buildTagName}`);
            }

      - name: Post Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const releaseTrack = '${{ github.event.inputs.tracks || 'production' }}';
            console.log(`${status} Android Deployment to ${releaseTrack} track: ${{ job.status }}`);
