// Root build.gradle (Groovy)

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Android library plugins can access the Flutter extension while their build scripts are evaluated.
subprojects { subproject ->
    ["com.android.application", "com.android.library"].each { pluginId ->
        subproject.pluginManager.withPlugin(pluginId) {
            if (subproject.extensions.findByName("flutter") == null) {
                subproject.extensions.add("flutter", [
                    compileSdkVersion: 34,
                    minSdkVersion: 24,
                    targetSdkVersion: 34,
                    ndkVersion: "28.2.13676358"
                ])
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
