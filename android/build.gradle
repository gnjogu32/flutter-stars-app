// Root build.gradle (Groovy)

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def flutterCompatibilityExtension = [
    compileSdkVersion: 34,
    minSdkVersion: 24,
    targetSdkVersion: 34,
    ndkVersion: "28.2.13676358"
]

subprojects { subproject ->
    def addFlutterCompatibilityExtension = {
        if (subproject.extensions.findByName("flutter") == null) {
            subproject.extensions.add("flutter", flutterCompatibilityExtension)
        }
    }

    subproject.pluginManager.withPlugin("com.android.application") {
        addFlutterCompatibilityExtension()
    }

    subproject.pluginManager.withPlugin("com.android.library") {
        addFlutterCompatibilityExtension()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
