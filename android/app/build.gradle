plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}


android {
    namespace "com.starpage.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.starpage.app"
        minSdk = 24
        targetSdk = 36
        versionCode = 23
        versionName = "1.1.17"
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (!keystorePropertiesFile.exists()) {
                keystorePropertiesFile = file('../key.properties')
            }
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(keystorePropertiesFile.newDataInputStream())
            }

            def envOrProperty = { String name, String envName, String fallback = null ->
                def value = keystoreProperties.getProperty(name)
                if (value == null || value.trim().isEmpty()) {
                    value = System.getenv(envName)
                }
                if (value == null || value.trim().isEmpty()) {
                    value = fallback
                }
                return value?.trim()
            }

            def keyAliasValue = envOrProperty('keyAlias', 'ANDROID_KEY_ALIAS', 'starpage')
            def keyPasswordValue = envOrProperty('keyPassword', 'ANDROID_KEY_PASSWORD', 'starpage2026')
            def storePasswordValue = envOrProperty('storePassword', 'ANDROID_KEYSTORE_PASSWORD', 'starpage2026')
            def storeFilePath = envOrProperty('storeFile', 'ANDROID_STORE_FILE', 'upload-keystore.jks')

            if (keyAliasValue && keyPasswordValue && storePasswordValue && storeFilePath) {
                keyAlias = keyAliasValue
                keyPassword = keyPasswordValue
                storePassword = storePasswordValue

                def signingStoreFile = new File(storeFilePath)
                if (!signingStoreFile.isAbsolute()) {
                    signingStoreFile = new File(project.projectDir, storeFilePath)
                    if (!signingStoreFile.exists()) {
                        signingStoreFile = new File(rootProject.projectDir, storeFilePath)
                    }
                }
                if (signingStoreFile.exists()) {
                    storeFile = signingStoreFile
                    println "Release signing resolved: storeFile=${signingStoreFile.absolutePath}, keyAlias=${keyAliasValue}"
                } else {
                    println "Warning: Release signing file not found at ${storeFilePath}; skipping release signing."
                }
            } else {
                println "Warning: Missing Android release signing credentials; release signing will be skipped."
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile?.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig null
                println "Release build is running without signing because required credentials are unavailable."
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('com.google.firebase:firebase-bom:34.13.0')
    implementation 'com.google.firebase:firebase-analytics'
}
